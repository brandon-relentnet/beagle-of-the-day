<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dog of the Moment</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B6%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="stage">
      <header class="stage__header">
        <p class="eyebrow">A small website</p>
        <h1>Dog of the Moment</h1>
        <p class="lede">Pick a breed. Press the button. Meet a dog.</p>
      </header>

      <div class="picker">
        <label for="breed" class="picker__label">Breed</label>
        <select id="breed" class="picker__select" aria-label="Choose a breed">
          <option value="beagle" data-label="Beagle">Beagle</option>
          <option value="cavapoo" data-label="Cavapoo">Cavapoo</option>
          <option value="retriever/golden" data-label="Golden Retriever">Golden Retriever</option>
          <option value="labrador" data-label="Labrador">Labrador</option>
          <option value="husky" data-label="Husky">Husky</option>
        </select>
      </div>

      <figure class="card" aria-busy="false">
        <div class="card__media">
          <img
            id="dog"
            alt="A random dog"
            decoding="async"
            fetchpriority="high"
          />
          <div class="card__skeleton" aria-hidden="true"></div>
          <div class="card__error" role="alert" hidden>
            <p>Couldn't fetch a dog. Check your connection and try again.</p>
          </div>
        </div>
        <figcaption class="card__caption">
          <span id="counter" aria-live="polite">Beagle #1</span>
        </figcaption>
      </figure>

      <div class="actions">
        <button id="next" type="button" class="btn">
          <span class="btn__label">Show me another</span>
          <svg
            class="btn__icon"
            viewBox="0 0 24 24"
            width="18"
            height="18"
            aria-hidden="true"
          >
            <path
              d="M4 12a8 8 0 0 1 13.66-5.66L20 4v6h-6l2.34-2.34A6 6 0 1 0 18 12h2a8 8 0 1 1-16 0z"
              fill="currentColor"
            />
          </svg>
        </button>
      </div>

      <footer class="foot">
        <p>
          Photos courtesy of
          <a href="https://dog.ceo/dog-api/" rel="noopener noreferrer" target="_blank">Dog CEO API</a>.
        </p>
      </footer>
    </main>

    <script src="app.js" type="module"></script>
  </body>
</html>
