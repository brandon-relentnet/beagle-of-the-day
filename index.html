<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beagle of the Moment</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B6%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="stage">
      <header class="stage__header">
        <p class="eyebrow">A small website</p>
        <h1>Beagle of the Moment</h1>
        <p class="lede">Press the button. Meet a beagle.</p>
      </header>

      <figure class="card" aria-busy="false">
        <div class="card__media">
          <img
            id="beagle"
            alt="A random beagle"
            decoding="async"
            fetchpriority="high"
          />
          <div class="card__skeleton" aria-hidden="true"></div>
          <div class="card__error" role="alert" hidden>
            <p>Couldn't fetch a beagle. Check your connection and try again.</p>
          </div>
        </div>
        <figcaption class="card__caption">
          <span id="counter" aria-live="polite">Beagle #1</span>
        </figcaption>
      </figure>

      <div class="actions">
        <button id="next" type="button" class="btn">
          <span class="btn__label">Show me another beagle</span>
          <svg
            class="btn__icon"
            viewBox="0 0 24 24"
            width="18"
            height="18"
            aria-hidden="true"
          >
            <path
              d="M4 12a8 8 0 0 1 13.66-5.66L20 4v6h-6l2.34-2.34A6 6 0 1 0 18 12h2a8 8 0 1 1-16 0z"
              fill="currentColor"
            />
          </svg>
        </button>
      </div>

      <footer class="foot">
        <p>
          Photos courtesy of
          <a href="https://dog.ceo/dog-api/" rel="noopener noreferrer" target="_blank">Dog CEO API</a>.
        </p>
      </footer>
    </main>

    <script src="app.js" type="module"></script>
  </body>
</html>
